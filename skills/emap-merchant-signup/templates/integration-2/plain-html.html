<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for a Merchant Account</title>
  <!--
    Referrer-Policy: no-referrer prevents the EMAP URL (which contains PII in query params)
    from being sent as the Referer header to any third-party scripts on the EMAP page.
    Also set this in your HTTP response headers — the meta tag is a fallback only.
  -->
  <meta name="referrer" content="no-referrer">
  <style>
    .emap-signup, .emap-signup *, .emap-signup *::before, .emap-signup *::after { box-sizing: border-box; }

    .emap-signup {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      margin: 0;
      padding: 40px 16px;
    }

    .emap-signup .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 36px;
    }

    .emap-signup h1 {
      font-size: 1.6rem;
      margin: 0 0 6px;
      color: #0f172a;
    }

    .emap-signup .subtitle {
      color: #64748b;
      margin: 0 0 28px;
      font-size: .95rem;
    }

    .emap-signup .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .emap-signup .form-group {
      margin-bottom: 18px;
    }

    .emap-signup label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }

    .emap-signup label .required {
      color: #ef4444;
      margin-left: 2px;
    }

    .emap-signup input, .emap-signup select {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      font-size: .95rem;
      color: #1f2937;
      background: #fff;
      transition: border-color .15s;
      appearance: none;
    }

    .emap-signup input:focus, .emap-signup select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }

    .emap-signup input.error, .emap-signup select.error {
      border-color: #ef4444;
    }

    .emap-signup .field-error {
      display: block;
      color: #ef4444;
      font-size: .8rem;
      margin-top: 4px;
    }

    .emap-signup button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }

    .emap-signup button[type="submit"]:hover:not(:disabled) { background: #2563eb; }
    .emap-signup button[type="submit"]:disabled { opacity: .65; cursor: not-allowed; }

    .emap-signup .alert {
      padding: 12px 16px;
      border-radius: 7px;
      margin-bottom: 20px;
      font-size: .9rem;
    }
    .emap-signup .alert-error { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }

    /* Hide honeypot from real users */
    .emap-signup .hp-field { display: none !important; }
  </style>
  <!-- Standalone-page chrome only. When embedding the form into an existing
       page/template, copy the style block above, the .emap-signup element
       and the script tags, but NOT this block: it styles the host page's
       body element. -->
  <style>
    body { margin: 0; background: #f5f7fa; }
  </style>
</head>
<body>
  <div class="emap-signup">
  <div class="card">
    <h1>Apply for a Merchant Account</h1>
    <p class="subtitle">Fill in your business details below. You'll complete the rest on Easy Pay Direct's secure platform.</p>

    <div id="form-error" class="alert alert-error" style="display:none"></div>

    <form id="signup-form" novalidate>

      <!-- Honeypot: never shown to humans; bots often fill this in -->
      <input class="hp-field" name="_hp" tabindex="-1" autocomplete="off">

      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name <span class="required">*</span></label>
          <input id="first_name" name="first_name" type="text" maxlength="255" autocomplete="given-name" required>
          <span class="field-error" id="err_first_name"></span>
        </div>
        <div class="form-group">
          <label for="last_name">Last Name <span class="required">*</span></label>
          <input id="last_name" name="last_name" type="text" maxlength="255" autocomplete="family-name" required>
          <span class="field-error" id="err_last_name"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input id="email" name="email" type="email" maxlength="255" autocomplete="email" required>
        <span class="field-error" id="err_email"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input id="phone" name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="+1 202 555 1234" required>
        <span class="field-error" id="err_phone"></span>
      </div>

      <div class="form-group">
        <label for="company_name">Company Name <span class="required">*</span></label>
        <input id="company_name" name="company_name" type="text" maxlength="255" autocomplete="organization" required>
        <span class="field-error" id="err_company_name"></span>
      </div>

      <div class="form-group">
        <label for="website">Company Website <span class="required">*</span></label>
        <input id="website" name="website" type="url" maxlength="255" autocomplete="url" placeholder="https://yourcompany.com" required>
        <span class="field-error" id="err_website"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="country">Country <span class="required">*</span></label>
          <select id="country" name="country" required>
            <option value="">Loading countries…</option>
          </select>
          <span class="field-error" id="err_country"></span>
        </div>
        <div class="form-group" id="state_group" style="display:none">
          <label for="business_state">State <span class="required">*</span></label>
          <select id="business_state" name="business_state">
            <option value="">Loading states…</option>
          </select>
          <span class="field-error" id="err_business_state"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="annual_sales">Annual Sales (USD) <span class="required">*</span></label>
        <input id="annual_sales" name="annual_sales" type="number" min="1" required placeholder="e.g. 500000">
        <span class="field-error" id="err_annual_sales"></span>
      </div>

      <div class="form-group">
        <label for="industry_type">Industry Type <span class="required">*</span></label>
        <select id="industry_type" name="industry_type" required>
          <option value="">Loading industries…</option>
        </select>
        <span class="field-error" id="err_industry_type"></span>
      </div>

      <div class="form-group" id="industry_type_other_group" style="display:none">
        <label for="industry_type_other">Describe your industry <span class="required">*</span></label>
        <input id="industry_type_other" name="industry_type_other" type="text" maxlength="255" placeholder="Briefly describe your industry">
        <span class="field-error" id="err_industry_type_other"></span>
      </div>

      <div class="form-group">
        <label for="promo_code">Referral / Promo Code</label>
        <input id="promo_code" name="promo_code" type="text" maxlength="255" autocomplete="off">
      </div>

      <button type="submit" id="submit-btn">Continue to Easy Pay Direct →</button>
    </form>
  </div>

  </div><!-- .emap-signup -->

h Support - SEO Services","slug":"Remote-Tech-Support-SEO-Services"},{"name":"Restaurants","slug":"Restaurants"},{"name":"Retail (eCommerce) - Art & Design","slug":"Retail(eCommerce)-Art-Design"},{"name":"Retail (eCommerce) - Fashion","slug":"Retail(eCommerce)-Fashion"},{"name":"Retail (eCommerce) - Furniture","slug":"Retail(eCommerce)-Furniture"},{"name":"Retail (eCommerce) - Other","slug":"Retail(eCommerce)-Other"},{"name":"Retail (eCommerce) - Sports Equipment","slug":"Retail(eCommerce)-Sports-Equipment"},{"name":"Salon (independent hair stylist)","slug":"Salon(independent-hair-stylist)"},{"name":"Salon (NOT independent stylist)","slug":"Salon(NOT-independent-stylist)"},{"name":"SEO/Hosting","slug":"SEO/Hosting"},{"name":"Smoking - E-Cigs & Vaporizers","slug":"Smoking-E-Cigs-Vaporizers"},{"name":"Smoking - Herbals (K2, 'Potpourri', etc)","slug":"Smoking-Herbals(K2,Potpourri,etc)"},{"name":"Smoking - Hookahs","slug":"Smoking-Hookahs"},{"name":"Smoking - Marijuana","slug":"Smoking-Marijuana"},{"name":"Smoking - Other","slug":"Smoking-Other"},{"name":"Software As A Service (SAAS)","slug":"Software-As-A-Service(SAAS)"},{"name":"Software Sales - Anti-Virus","slug":"Software-Sales-Anti-Virus"},{"name":"Software Sales - Other","slug":"Software-Sales-Other"},{"name":"Survival Prep","slug":"Survival-Prep"},{"name":"Survival Prep - Information Product","slug":"Survival-Prep-Information-Product"},{"name":"Travel - Cruise Bookings","slug":"Travel-Cruise-Bookings"},{"name":"Travel - Hotel Bookings","slug":"Travel-Hotel-Bookings"},{"name":"Travel - Travel Clubs (Discounts)","slug":"Travel-Travel-Clubs(Discounts)"},{"name":"Travel - Travel Packages","slug":"Travel-Travel-Packages"},{"name":"Virtual Assistants","slug":"Virtual-Assistants"}]}};

    // Parses a response body as JSON, or returns null when it isn't JSON.
    // Rate limiters, proxies and CDNs often answer 429/5xx with an HTML page.
    async function readJson(res) {
      try { return await res.json(); } catch (_) { return null; }
    }

    // Drops rows with no usable value (EMAP's data can include, e.g., a
    // country whose code is null), so they never render as a blank option.
    const DROPDOWN_VALUE_KEY = { countries: 'code', states: 'code', industry_types: 'slug' };
    function usableRows(list, fallbackKey) {
      const key = DROPDOWN_VALUE_KEY[fallbackKey];
      return key ? list.filter(function (row) { return row && row[key]; }) : list;
    }

    // Fetches one EMAP dropdown endpoint directly from the browser, falling
    // back to EMAP_DROPDOWN_FALLBACKS[fallbackKey] on any failure.
    async function fetchDropdownData(path, fallbackKey) {
      const ctrl = typeof AbortController === 'function' ? new AbortController() : null;
      const timer = ctrl ? setTimeout(function () { ctrl.abort(); }, 8000) : null;
      try {
        const res = await fetch(EMAP_BASE_URL + path, {
          headers: { 'Accept': 'application/json' },
          signal: ctrl ? ctrl.signal : undefined,
        });
        const json = await readJson(res);
        const rows = res.ok && json && Array.isArray(json.data) ? usableRows(json.data, fallbackKey) : [];
        if (rows.length > 0) return rows;
      } catch (_) { /* fall through to fallback */ }
      finally { if (timer) clearTimeout(timer); }
      return usableRows(EMAP_DROPDOWN_FALLBACKS[fallbackKey].data, fallbackKey);
    }

    function fillSelect(id, placeholder, list, build) {
      const sel = document.getElementById(id);
      sel.innerHTML = '<option value="">' + placeholder + '</option>';
      list.forEach(function (item) { sel.appendChild(build(item)); });
    }

    async function loadDropdowns() {
      if (!EMAP_BASE_URL) return;
      const [countries, states, industryTypes] = await Promise.all([
        fetchDropdownData('/api/partner/countries', 'countries'),
        fetchDropdownData('/api/partner/states', 'states'),
        fetchDropdownData('/api/partner/industry-types', 'industry_types'),
      ]);

      fillSelect('country', 'Select country…', countries, function (c) {
        const o = document.createElement('option');
        o.value = c.name; o.dataset.code = c.code; o.textContent = c.name;
        return o;
      });

      fillSelect('business_state', 'Select state…', states, function (s) {
        const o = document.createElement('option');
        o.value = s.code; o.textContent = s.name;
        return o;
      });

      // Industry types — value = name (sent as URL param to EMAP), data-slug = slug (for "other" detection)
      fillSelect('industry_type', 'Select industry…', industryTypes, function (t) {
        const o = document.createElement('option');
        o.value = t.name; o.dataset.slug = t.slug; o.textContent = t.name;
        return o;
      });
    }

    onReady(loadDropdowns);

    // Show/hide industry_type_other — check data-slug, not value, since value is now the name
    onReady(function () {
      document.getElementById('industry_type').addEventListener('change', function () {
        const grp = document.getElementById('industry_type_other_group');
        const inp = document.getElementById('industry_type_other');
        // EMAP's live /api/partner/industry-types returns the catch-all
        // option's slug as "Other" (capitalized) — compare case-insensitively.
        const isOther = (this.options[this.selectedIndex]?.dataset.slug || '').toLowerCase() === 'other';
        grp.style.display = isOther ? 'block' : 'none';
        inp.required = isOther;
        if (!isOther) inp.value = '';
        setError('industry_type_other', '');
      });
    });

    // Show/hide state field based on country selection
    document.getElementById('country').addEventListener('change', function () {
      const stateGroup = document.getElementById('state_group');
      const stateSelect = document.getElementById('business_state');
      const isUS = this.options[this.selectedIndex]?.dataset.code === 'US';
      stateGroup.style.display = isUS ? 'block' : 'none';
      stateSelect.required = isUS;
      if (!isUS) stateSelect.value = '';
    });

    // Campaign attribution: UTM params and ad click IDs from the landing URL,
    // passed through to EMAP's /signup page. Params on the URL replace
    // the stored ones; with none, the stored ones (kept in localStorage for 90
    // days) are reused, so a refresh or a direct return keeps the source.
    const TRACKING_KEYS = ['utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content',
                           'gclid', 'gbraid', 'wbraid', 'fbclid'];
    const TRACKING_STORE_KEY = 'emap_tracking';
    const TRACKING_TTL_MS = 30 * 24 * 60 * 60 * 1000;
    function getTrackingParams() {
      let values = {}, savedAt = Date.now();
      try {
        const saved = JSON.parse(localStorage.getItem(TRACKING_STORE_KEY) || 'null');
        if (saved && saved.values && Date.now() - saved.savedAt < TRACKING_TTL_MS) {
          values = saved.values;
          savedAt = saved.savedAt;
        }
      } catch (_) {}
      const current = new URLSearchParams(window.location.search);
      const fresh = {};
      TRACKING_KEYS.forEach(function (k) {
        const v = (current.get(k) || '').trim().slice(0, 255);
        if (v) fresh[k] = v;
      });
      if (Object.keys(fresh).length) {
        // New campaign params replace the stored ones; none = keep the stored ones.
        values = fresh;
        try { localStorage.setItem(TRACKING_STORE_KEY, JSON.stringify({ values: values, savedAt: Date.now() })); } catch (_) {}
      }
      return values;
    }

    function setError(fieldId, message) {
      const el = document.getElementById('err_' + fieldId);
      const input = document.getElementById(fieldId) || document.querySelector('[name="' + fieldId + '"]');
      if (el) el.textContent = message || '';
      if (input && message) input.classList.add('error');
      else if (input) input.classList.remove('error');
    }

    function clearErrors() {
      document.querySelectorAll('.field-error').forEach(function (el) { el.textContent = ''; });
      document.querySelectorAll('.error').forEach(function (el) { el.classList.remove('error'); });
      document.getElementById('form-error').style.display = 'none';
    }

    const PHONE_RE   = /^[0-9+\-()\s]+$/;
    const WEBSITE_RE = /^(https?:\/\/)?[a-zA-Z0-9]([a-zA-Z0-9\-]*\.)+[a-zA-Z]{2,}(\/[^\s]*)?$/;
    const EMAIL_RE   = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
    const VALID_US_STATES = new Set([
      'AL','AK','AZ','AR','CA','CO','CT','DE','FL','GA','HI','ID','IL','IN','IA',
      'KS','KY','LA','ME','MD','MA','MI','MN','MS','MO','MT','NE','NV','NH','NJ',
      'NM','NY','NC','ND','OH','OK','OR','PA','RI','SC','SD','TN','TX','UT','VT',
      'VA','WA','WV','WI','WY','DC',
    ]);

    function validateForm(data) {
      const errors = {};

      if (!data.first_name)                   errors.first_name   = 'First name is required';
      else if (data.first_name.length > 255)   errors.first_name   = 'First name must be 255 characters or fewer';

      if (!data.last_name)                    errors.last_name    = 'Last name is required';
      else if (data.last_name.length > 255)    errors.last_name    = 'Last name must be 255 characters or fewer';

      if (!data.email)                        errors.email        = 'Email is required';
      else if (!EMAIL_RE.test(data.email))    errors.email        = 'A valid email address is required';

      if (!data.phone)                        errors.phone        = 'Phone number is required';
      else if (data.phone.length > 20)        errors.phone        = 'Phone must be 20 characters or fewer';
      else if (!PHONE_RE.test(data.phone))    errors.phone        = 'Phone may only contain digits, +, -, (, ), and spaces';

      if (!data.company_name)                 errors.company_name = 'Company name is required';
      else if (data.company_name.length > 255) errors.company_name = 'Company name must be 255 characters or fewer';

      if (!data.website)                      errors.website      = 'Website is required';
      else if (!WEBSITE_RE.test(data.website)) errors.website     = 'Website must be a valid URL (e.g. https://yourcompany.com)';

      if (!data.country)                      errors.country      = 'Country is required';

      if (!data.industry_type)                errors.industry_type = 'Industry type is required';
      if ((data.industry_type || '').toLowerCase() === 'other' && !data.industry_type_other)
                                              errors.industry_type_other = 'Please describe your industry';

      const sales = Number(data.annual_sales);
      if (!data.annual_sales || isNaN(sales) || sales < 1)
                                              errors.annual_sales = 'Annual sales must be at least 1';
      else if (sales > 999999999999)          errors.annual_sales = 'Annual sales value is too large';

      const countryEl = document.getElementById('country');
      const selectedCode = countryEl.options[countryEl.selectedIndex]?.dataset.code;
      if (selectedCode === 'US') {
        if (!data.business_state)                            errors.business_state = 'State is required for US businesses';
        else if (!VALID_US_STATES.has(data.business_state)) errors.business_state = 'Must be a valid US state code';
      }

      return errors;
    }

    // ── Auto-save ────────────────────────────────────────────────────────────
    // Like EMAP's own signup page: once name, email and phone are filled in,
    // leaving one of those fields saves the person to EMAP (POST
    // /api/v1/signup/auto-save), which creates their account and HubSpot
    // contact before the form is submitted, so a merchant who stops here can
    // still be followed up. EMAP's page skips its own auto-save for visitors
    // sent here with Step 1 filled in, so this is the only one they get. It
    // runs in the background and never shows an error; the submit waits for
    // one that is still running before redirecting.
    const AUTOSAVE_FIELDS = ['first_name', 'last_name', 'email', 'phone'];
    let autoSavedEmail = '';   // saved (or already registered) — nothing more to do for it
    let autoSaveTriedKey = ''; // values EMAP last rejected, so they aren't resent unchanged
    let autoSavePending = null;
    let formSubmitted = false;
    function autoSave() {
      if (formSubmitted || autoSavePending || !EMAP_BASE_URL) return;
      if (document.querySelector('[name="_hp"]').value) return;
      const v = {};
      AUTOSAVE_FIELDS.forEach(function (id) { v[id] = (document.getElementById(id).value || '').trim(); });
      const digits = v.phone.replace(/\D/g, '');
      if (!v.first_name || !v.last_name || !EMAIL_RE.test(v.email) ||
          digits.length < 10 || digits.length > 15) return;
      const key = JSON.stringify(v);
      if (v.email === autoSavedEmail || key === autoSaveTriedKey) return;
      const payload = Object.assign({}, v, getTrackingParams());
      if (EMAP_PARTNER_KEY) payload.partner_key = EMAP_PARTNER_KEY;
      autoSavePending = fetch(EMAP_BASE_URL + '/api/v1/signup/auto-save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload),
      }).then(function (res) {
        // 400 = the email is already registered; EMAP's signup page handles that.
        if (res.ok || res.status === 400) autoSavedEmail = v.email;
        else if (res.status === 422) autoSaveTriedKey = key;
      }).catch(function () {}).then(function () { autoSavePending = null; });
    }
    AUTOSAVE_FIELDS.forEach(function (id) {
      document.getElementById(id).addEventListener('blur', autoSave);
    });

    document.getElementById('signup-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearErrors();

      // Honeypot check — silent rejection
      if (document.querySelector('[name="_hp"]').value) return;

      const formData = new FormData(this);
      const data = {};
      for (const [key, value] of formData.entries()) {
        if (key !== '_hp') data[key] = value.trim();
      }

      const errors = validateForm(data);
      if (Object.keys(errors).length > 0) {
        Object.entries(errors).forEach(function ([field, msg]) { setError(field, msg); });
        const firstError = document.querySelector('.field-error:not(:empty)');
        if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Redirecting…';

      // Let a running auto-save finish first, so it and EMAP's Step 1 don't
      // both try to create the account.
      formSubmitted = true;
      if (autoSavePending) await autoSavePending;

      const params = new URLSearchParams();

      // Core fields
      ['first_name', 'last_name', 'email', 'phone', 'company_name', 'website',
       'country', 'annual_sales', 'business_state', 'industry_type',
       'industry_type_other', 'promo_code'].forEach(function (k) {
        if (data[k]) params.set(k, data[k]);
      });

      // Pass through tracking params from current page
      Object.entries(getTrackingParams()).forEach(function ([k, v]) { params.set(k, v); });

      // Partner attribution: EMAP names this URL param secretKey, but the value is
      // the partner key, an attribution value that is visible in the page anyway.
      if (EMAP_PARTNER_KEY) params.set('secretKey', EMAP_PARTNER_KEY);

      const redirectUrl = EMAP_BASE_URL + '/signup?' + params.toString();
      navigateTop(redirectUrl);
    });

    // Runs fn once the markup exists — immediately if this script is injected
    // after the page finished parsing (a framework component, a CMS embed,
    // a script loaded late), otherwise on DOMContentLoaded.
    function onReady(fn) {
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', fn);
      } else {
        fn();
      }
    }

    // Leaves the page via the top-level window so the handoff to EMAP also
    // works when this form is embedded in an iframe (EMAP's pages may refuse
    // to render inside a frame). Falls back to this frame if the embedder's
    // sandbox forbids top-level navigation.
    function navigateTop(url) {
      try {
        window.top.location.href = url;
      } catch (_) {
        window.location.href = url;
      }
    }
    })();
  </script>
