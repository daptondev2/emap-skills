<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apply for a Merchant Account</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f5f7fa;
      color: #1a1a2e;
      margin: 0;
      padding: 40px 16px;
    }

    .card {
      max-width: 560px;
      margin: 0 auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,.08);
      padding: 40px 36px;
    }

    h1 { font-size: 1.6rem; margin: 0 0 6px; color: #0f172a; }
    .subtitle { color: #64748b; margin: 0 0 28px; font-size: .95rem; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { margin-bottom: 18px; }

    label {
      display: block;
      font-size: .85rem;
      font-weight: 600;
      color: #374151;
      margin-bottom: 5px;
    }
    label .required { color: #ef4444; margin-left: 2px; }

    input, select {
      width: 100%;
      padding: 10px 13px;
      border: 1.5px solid #d1d5db;
      border-radius: 7px;
      font-size: .95rem;
      color: #1f2937;
      background: #fff;
      transition: border-color .15s;
      appearance: none;
    }
    input:focus, select:focus {
      outline: none;
      border-color: #3b82f6;
      box-shadow: 0 0 0 3px rgba(59,130,246,.15);
    }
    input.error, select.error { border-color: #ef4444; }

    .field-error { display: block; color: #ef4444; font-size: .8rem; margin-top: 4px; }

    .terms-group {
      margin: 20px 0;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .terms-group input[type="checkbox"] {
      width: 17px; height: 17px; flex-shrink: 0; margin-top: 2px; cursor: pointer;
    }
    .terms-group label { font-size: .88rem; font-weight: 400; color: #4b5563; cursor: pointer; }
    .terms-group a { color: #3b82f6; }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, opacity .15s;
    }
    button[type="submit"]:hover:not(:disabled) { background: #2563eb; }
    button[type="submit"]:disabled { opacity: .65; cursor: not-allowed; }

    .alert { padding: 14px 16px; border-radius: 8px; margin-bottom: 20px; font-size: .9rem; }
    .alert-error   { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .alert-success { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .alert-warning { background: #fffbeb; color: #92400e; border: 1px solid #fde68a; }

    .hp-field { display: none !important; }

    #success-panel { display: none; text-align: center; padding: 20px 0; }
    #success-panel .icon { font-size: 3rem; margin-bottom: 12px; }
    #success-panel h2 { color: #166534; margin: 0 0 8px; }
    #success-panel p { color: #4b5563; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Apply for a Merchant Account</h1>
    <p class="subtitle">Fill in your business details to get started. You'll complete the application on Easy Pay Direct's secure platform.</p>

    <div id="form-alert" class="alert" style="display:none"></div>

    <!-- Success state — shown after successful submission -->
    <div id="success-panel">
      <div class="icon">✅</div>
      <h2>Application Submitted!</h2>
      <p>Check your inbox for an email from Easy Pay Direct with next steps.</p>
      <p id="success-uuid" style="color:#6b7280;font-size:.85rem"></p>
    </div>

    <form id="signup-form" novalidate>
      <!-- Honeypot: never shown to real users; bots often fill this in -->
      <input class="hp-field" name="_hp" tabindex="-1" autocomplete="off">

      <div class="form-row">
        <div class="form-group">
          <label for="first_name">First Name <span class="required">*</span></label>
          <input id="first_name" name="first_name" type="text" maxlength="255" autocomplete="given-name" required>
          <span class="field-error" id="err_first_name"></span>
        </div>
        <div class="form-group">
          <label for="last_name">Last Name <span class="required">*</span></label>
          <input id="last_name" name="last_name" type="text" maxlength="255" autocomplete="family-name" required>
          <span class="field-error" id="err_last_name"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="email">Email Address <span class="required">*</span></label>
        <input id="email" name="email" type="email" maxlength="255" autocomplete="email" required>
        <span class="field-error" id="err_email"></span>
      </div>

      <div class="form-group">
        <label for="phone">Phone Number <span class="required">*</span></label>
        <input id="phone" name="phone" type="tel" maxlength="20" autocomplete="tel" placeholder="+1 202 555 1234" required>
        <span class="field-error" id="err_phone"></span>
      </div>

      <!--
        NOTE: The API field for company name is 'name' (not 'company_name').
        We use name="company_name" on the HTML input for clarity and map it
        to 'name' in the fetch call below.
      -->
      <div class="form-group">
        <label for="company_name">Company Name <span class="required">*</span></label>
        <input id="company_name" name="company_name" type="text" maxlength="255" autocomplete="organization" required>
        <span class="field-error" id="err_company_name"></span>
      </div>

      <div class="form-group">
        <label for="website">Company Website <span class="required">*</span></label>
        <input id="website" name="website" type="url" maxlength="255" autocomplete="url" placeholder="https://yourcompany.com" required>
        <span class="field-error" id="err_website"></span>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="country">Country <span class="required">*</span></label>
          <select id="country" name="country" required>
            <option value="">Loading countries…</option>
          </select>
          <span class="field-error" id="err_country"></span>
        </div>
        <div class="form-group" id="state_group" style="display:none">
          <label for="business_state">State <span class="required">*</span></label>
          <select id="business_state" name="business_state">
            <option value="">Select state…</option>
            <option value="AL">Alabama</option><option value="AK">Alaska</option>
            <option value="AZ">Arizona</option><option value="AR">Arkansas</option>
            <option value="CA">California</option><option value="CO">Colorado</option>
            <option value="CT">Connecticut</option><option value="DE">Delaware</option>
            <option value="FL">Florida</option><option value="GA">Georgia</option>
            <option value="HI">Hawaii</option><option value="ID">Idaho</option>
            <option value="IL">Illinois</option><option value="IN">Indiana</option>
            <option value="IA">Iowa</option><option value="KS">Kansas</option>
            <option value="KY">Kentucky</option><option value="LA">Louisiana</option>
            <option value="ME">Maine</option><option value="MD">Maryland</option>
            <option value="MA">Massachusetts</option><option value="MI">Michigan</option>
            <option value="MN">Minnesota</option><option value="MS">Mississippi</option>
            <option value="MO">Missouri</option><option value="MT">Montana</option>
            <option value="NE">Nebraska</option><option value="NV">Nevada</option>
            <option value="NH">New Hampshire</option><option value="NJ">New Jersey</option>
            <option value="NM">New Mexico</option><option value="NY">New York</option>
            <option value="NC">North Carolina</option><option value="ND">North Dakota</option>
            <option value="OH">Ohio</option><option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option><option value="PA">Pennsylvania</option>
            <option value="RI">Rhode Island</option><option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option><option value="TN">Tennessee</option>
            <option value="TX">Texas</option><option value="UT">Utah</option>
            <option value="VT">Vermont</option><option value="VA">Virginia</option>
            <option value="WA">Washington</option><option value="WV">West Virginia</option>
            <option value="WI">Wisconsin</option><option value="WY">Wyoming</option>
            <option value="DC">District of Columbia</option>
          </select>
          <span class="field-error" id="err_business_state"></span>
        </div>
      </div>

      <div class="form-group">
        <label for="annual_sales">Annual Sales (USD) <span class="required">*</span></label>
        <input id="annual_sales" name="annual_sales" type="number" min="1" required placeholder="e.g. 500000">
        <span class="field-error" id="err_annual_sales"></span>
      </div>

      <div class="form-group">
        <label for="promo_code">Referral / Promo Code</label>
        <input id="promo_code" name="promo_code" type="text" maxlength="255" autocomplete="off">
      </div>

      <div class="terms-group">
        <input type="checkbox" id="terms_agreed" name="terms_agreed">
        <label for="terms_agreed">
          I agree to the
          <a href="https://emap.epd.dev/terms" target="_blank" rel="noopener">Terms and Conditions</a>
        </label>
      </div>
      <span class="field-error" id="err_terms" style="display:block;margin-top:-10px;margin-bottom:10px"></span>

      <button type="submit" id="submit-btn">Submit Application</button>
    </form>
  </div>

  <script>
    /*
     * IMPORTANT: This form POSTs to /api/signup on YOUR backend.
     * Your backend (see node-express.js / php-vanilla.php / nextjs-route.ts)
     * then calls EMAP's API with your partner key from the environment.
     * Never call EMAP's API directly from this file.
     */

    // ── Load countries from backend proxy ────────────────────────────────────
    const FALLBACK_COUNTRIES = [
      { code: 'US', name: 'United States' }, { code: 'CA', name: 'Canada' },
      { code: 'GB', name: 'United Kingdom' }, { code: 'AU', name: 'Australia' },
    ];

    (async function loadCountries() {
      try {
        const res = await fetch('/api/countries');
        const json = await res.json();
        const list = json.data || [];
        const sel = document.getElementById('country');
        sel.innerHTML = '<option value="">Select country…</option>';
        list.forEach(function (c) {
          const o = document.createElement('option');
          o.value = c.code; o.textContent = c.name;
          sel.appendChild(o);
        });
      } catch (_) {
        const sel = document.getElementById('country');
        sel.innerHTML = '<option value="">Select country…</option>';
        FALLBACK_COUNTRIES.forEach(function (c) {
          const o = document.createElement('option');
          o.value = c.code; o.textContent = c.name;
          sel.appendChild(o);
        });
      }
    })();

    // Show/hide state field
    document.getElementById('country').addEventListener('change', function () {
      const stateGroup = document.getElementById('state_group');
      const stateSelect = document.getElementById('business_state');
      const isUS = this.value === 'US';
      stateGroup.style.display = isUS ? 'block' : 'none';
      stateSelect.required = isUS;
      if (!isUS) stateSelect.value = '';
      clearError('business_state');
    });

    function showAlert(type, message) {
      const el = document.getElementById('form-alert');
      el.className = 'alert alert-' + type;
      el.textContent = message;
      el.style.display = 'block';
      el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    function setError(fieldId, message) {
      const errorEl = document.getElementById('err_' + fieldId);
      const input = document.getElementById(fieldId) ||
                    document.querySelector('[name="' + fieldId + '"]');
      if (errorEl) errorEl.textContent = message || '';
      if (input) {
        if (message) input.classList.add('error');
        else input.classList.remove('error');
      }
    }

    function clearError(fieldId) { setError(fieldId, ''); }

    function clearAllErrors() {
      document.querySelectorAll('.field-error').forEach(function (el) { el.textContent = ''; });
      document.querySelectorAll('.error').forEach(function (el) { el.classList.remove('error'); });
      document.getElementById('form-alert').style.display = 'none';
    }

    function validateLocally(data) {
      const errors = {};
      if (!data.first_name)   errors.first_name   = 'First name is required';
      if (!data.last_name)    errors.last_name    = 'Last name is required';
      if (!data.email || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.email))
                              errors.email        = 'A valid email address is required';
      if (!data.phone)        errors.phone        = 'Phone number is required';
      if (!data.company_name) errors.company_name = 'Company name is required';
      if (!data.website)      errors.website      = 'Website is required';
      if (!data.country)      errors.country      = 'Country is required';
      if (!data.annual_sales || isNaN(Number(data.annual_sales)) || Number(data.annual_sales) < 1)
                              errors.annual_sales = 'Annual sales must be a positive number';
      if (data.country === 'US' && !data.business_state)
                              errors.business_state = 'State is required for US businesses';
      return errors;
    }

    function displayServerErrors(errors) {
      // EMAP uses 'name' for company; map it back to our form field
      const fieldMap = { name: 'company_name' };
      for (const [field, messages] of Object.entries(errors)) {
        const localField = fieldMap[field] || field;
        const msg = Array.isArray(messages) ? messages[0] : messages;
        setError(localField, msg);
      }
      const firstError = document.querySelector('.field-error:not(:empty)');
      if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    document.getElementById('signup-form').addEventListener('submit', async function (e) {
      e.preventDefault();
      clearAllErrors();

      // Honeypot check — silent rejection
      if (document.querySelector('[name="_hp"]').value) return;

      if (!document.getElementById('terms_agreed').checked) {
        setError('terms', 'You must agree to the Terms and Conditions');
        return;
      }

      const formData = new FormData(this);
      const data = {};
      for (const [key, value] of formData.entries()) {
        if (key !== '_hp' && key !== 'terms_agreed') data[key] = value.trim();
      }

      // Client-side pre-validation
      const localErrors = validateLocally(data);
      if (Object.keys(localErrors).length > 0) {
        Object.entries(localErrors).forEach(function ([f, m]) { setError(f, m); });
        const firstError = document.querySelector('.field-error:not(:empty)');
        if (firstError) firstError.scrollIntoView({ behavior: 'smooth', block: 'center' });
        return;
      }

      const btn = document.getElementById('submit-btn');
      btn.disabled = true;
      btn.textContent = 'Submitting…';

      try {
        const response = await fetch('/api/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });

        const result = await response.json();

        if (response.status === 429) {
          showAlert('error', 'Too many attempts. Please wait a few minutes and try again.');
          btn.disabled = false;
          btn.textContent = 'Submit Application';
          return;
        }

        if (response.status === 422) {
          showAlert('error', 'Please correct the errors below.');
          displayServerErrors(result.errors || {});
          btn.disabled = false;
          btn.textContent = 'Submit Application';
          return;
        }

        if (!response.ok) {
          showAlert('error', 'Something went wrong. Please try again in a few moments.');
          btn.disabled = false;
          btn.textContent = 'Submit Application';
          return;
        }

        // Existing user — has a verification link
        if (result.verificationLink === true) {
          document.getElementById('signup-form').style.display = 'none';
          showAlert('warning',
            'You already have an Easy Pay Direct account. Check your email for a verification link, ' +
            'or click the button below to continue.'
          );
          if (result.url) {
            const continueBtn = document.createElement('a');
            continueBtn.href = result.url;
            continueBtn.textContent = 'Continue my application →';
            continueBtn.style.cssText = 'display:block;margin-top:12px;color:#3b82f6;font-weight:600';
            document.getElementById('form-alert').after(continueBtn);
          }
          return;
        }

        // Company already exists
        if (result.status === false && result.message === 'Company already exists') {
          showAlert('warning',
            'A company with this name already exists in our system. ' +
            'Please check your email for your existing application.'
          );
          btn.disabled = false;
          btn.textContent = 'Submit Application';
          return;
        }

        // Success — new user created
        if (result.status === true && result.uuid) {
          document.getElementById('signup-form').style.display = 'none';
          document.getElementById('success-panel').style.display = 'block';
          if (result.uuid) {
            document.getElementById('success-uuid').textContent =
              'Application reference: ' + result.uuid;
          }
          return;
        }

        // Unexpected response shape
        showAlert('error', 'An unexpected error occurred. Please try again.');
        btn.disabled = false;
        btn.textContent = 'Submit Application';

      } catch (err) {
        showAlert('error', 'A network error occurred. Please check your connection and try again.');
        btn.disabled = false;
        btn.textContent = 'Submit Application';
      }
    });
  </script>
</body>
</html>
